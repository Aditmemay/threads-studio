
name: Build Floating Tools APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        shell: bash
        run: |
          test -f FloatingToolsAndroid_source.zip
          unzip -q FloatingToolsAndroid_source.zip -d .
          echo "Project extracted"

      - name: Fix Java and Kotlin JVM target
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("app/build.gradle"))

          if not files:
              raise SystemExit("Cannot find app/build.gradle")

          p = files[0]
          print("Editing:", p)

          s = p.read_text()

          if not re.search(r'android\s*\{', s):
              raise SystemExit("Cannot find android block")

          compile_block = """compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }"""

          kotlin_block = """kotlinOptions {
                  jvmTarget = '17'
              }"""

          if re.search(r'compileOptions\s*\{[^}]*\}', s, re.S):
              s = re.sub(
                  r'compileOptions\s*\{[^}]*\}',
                  compile_block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    ' + compile_block,
                  s,
                  count=1
              )

          if re.search(r'kotlinOptions\s*\{[^}]*\}', s, re.S):
              s = re.sub(
                  r'kotlinOptions\s*\{[^}]*\}',
                  kotlin_block,
                  s,
                  count=1,
                  flags=re.S
              )
          else:
              s = re.sub(
                  r'(android\s*\{)',
                  r'\1\n    ' + kotlin_block,
                  s,
                  count=1
              )

          p.write_text(s)
          print("Java and Kotlin targets set to 17")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          APP_GRADLE="$(find . -path '*/app/build.gradle' -type f | head -n 1)"

          if [ -z "$APP_GRADLE" ]; then
            echo "App Gradle file not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$APP_GRADLE")")"

          echo "Building project: $PROJECT_DIR"

          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-tools-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
